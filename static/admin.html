<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHESA FIRM ENTERPRISES Admin</title><style>
:root{--bg:#f5faf6;--card:#fff;--ink:#202b25;--mut:#718078;--pri:#6d28d9;--line:#e2eae4;--contact:#16834a;--contact-bg:#e8f5ec}
@media(prefers-color-scheme:dark){:root{--bg:#171416;--card:#241f20;--ink:#f4eeee;--mut:#b8aaad;--pri:#ed626c;--line:#44383a}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#login{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border-radius:12px;border:1px solid var(--line)}
input,select,button{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
button{cursor:pointer;background:var(--pri);color:#fff;border:0}button.s{background:none;color:var(--pri);border:1px solid var(--pri);padding:3px 8px}
#app{display:none;min-height:100vh}nav{width:200px;padding:14px;border-right:1px solid var(--line);background:var(--card)}
nav b{display:block;margin-bottom:12px;color:var(--pri)}nav a{display:block;padding:7px 8px;border-radius:6px;cursor:pointer}nav a.on,nav a:hover{background:var(--bg)}
main{flex:1;padding:18px;overflow:auto;min-width:0}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.k b{font-size:22px;display:block}.k span{color:var(--mut)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.f{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}@media(max-width:700px){#app{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto}nav b{display:none}}

/* SHESA green + purple theme */
button{background:#6d28d9}button.s{color:#4c1d95;border-color:#6d28d9}nav b{color:#16834a}nav a.on,nav a:hover{background:#e8f5ec;color:#12633a}.k{border-color:#dcebe0}#login{box-shadow:0 12px 35px #28583a14}
</style></head><body>
<div id="login"><h2>SHESA FIRM ENTERPRISES<br><small>Marketplace administration</small></h2>
<input id="em" placeholder="Email" style="width:100%;margin:6px 0"><input id="pw" type="password" placeholder="Password" style="width:100%;margin:6px 0">
<button onclick="login()" style="width:100%">Sign in</button><p id="err" style="color:#c33"></p></div>
<div id="app" style="display:flex"><nav id="nav"><b>SHESA FIRM ENTERPRISES ADMIN</b></nav><main id="main"></main></div>
<script>
const $=id=>document.getElementById(id);let T=localStorage.getItem('mh')||'',H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+T});
const SECTIONS={overview:'📊 Overview',farm_issues:'🌱 Farm issues',users:'👥 Users',providers:'🏢 Providers',seller_profiles:'📱 Seller payout numbers',products:'🛍️ Products',product_orders:'📦 Product orders',product_order_items:'🧾 Order line items',activity:'🕒 Store activity',documents:'🪪 Verification docs',categories:'🌐 Industries & categories',services:'🧩 Services',escrow:'🔒 Escrow',bookings:'📅 Bookings',payments:'💳 Payments',reviews:'⭐ Reviews',complaints:'⚖️ Disputes',audit:'🔐 Audit log',settings:'⚙️ Settings'};
const ACT={users:[['status','active'],['status','suspended'],['status','blocked']],providers:[['verification_status','under_review'],['verification_status','more_info'],['verification_status','approved'],['verification_status','rejected'],['verification_status','suspended']],
escrow:[['esc','confirm'],['esc','reject'],['esc','release'],['esc','refund'],['esc','events']],bookings:[['status','confirmed'],['status','completed'],['status','cancelled']],payments:[['refund']],reviews:[['hidden',true],['hidden',false]],complaints:[['status','investigating'],['status','escalated'],['status','resolved']],categories:[['active',false],['active',true]],services:[['active',false],['active',true]],products:[['active',false],['active',true]]};
const CREATE={categories:['name','parent_id'],services:['name','category_id','description','price','currency'],settings:['key','value']};
async function api(p,m='GET',b){try{let r=await fetch('/api/'+p,{method:m,headers:H(),body:b!==undefined?JSON.stringify(b):undefined});let d=await r.json().catch(()=>({detail:'The server returned an unreadable response.'}));if(!r.ok){if(r.status===401){T='';localStorage.removeItem('mh')}alert(d.detail||('Request failed ('+r.status+')'));return null}return d}catch(e){alert('Could not reach the server. Check your internet connection and try again.');return null}}
async function login(){const email=$('em').value.trim(),password=$('pw').value;const error=$('err');error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({detail:'Invalid server response'}));if(!r.ok){error.textContent=d.detail||'Sign in failed';return}T=d.token;localStorage.setItem('mh',T);start()}catch(e){error.textContent='Unable to connect. Check your internet connection.'}}
function start(){$('login').style.display='none';$('app').style.display='flex';$('nav').innerHTML='<b>SHESA FIRM ENTERPRISES ADMIN</b>'+Object.entries(SECTIONS).map(([k,v])=>`<a onclick="show('${k}')" id="n_${k}">${v}</a>`).join('')+'<a onclick="signOut()">Sign out</a>';show('overview')}
function signOut(){localStorage.removeItem('mh');T='';location.reload()}
const login_= $('login');
let currentSection='';
async function show(k){currentSection=k;document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));document.getElementById('n_'+k)?.classList.add('on');
if(k=='overview'){let d=await api('admin/overview');if(!d)return;$('main').innerHTML='<h2>Overview</h2><a href="https://wa.me/254729395064" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:9px;margin:4px 0 16px;padding:11px 15px;border-radius:10px;background:var(--contact-bg);color:var(--contact);font-weight:750;text-decoration:none;border:1px solid #b9dfc5">WhatsApp: +254 729 395 064</a><div class="g">'+Object.entries(d).map(([a,b])=>`<div class="k"><b>${b}</b><span>${a.replace(/_/g,' ')}</span></div>`).join('')+'</div>';return}
if(k=='farm_issues'){let rows=await api('admin/farm-issues');if(!rows)return;$('main').innerHTML='<h2>Farm issue reports</h2><p>Review customer reports, reply as support, and update their status.</p><div class="w"><table><tr><th>ID</th><th>Customer</th><th>Crop</th><th>Issue</th><th>Urgency</th><th>Status</th><th>Created</th><th></th></tr>'+rows.map(r=>'<tr><td>'+r.id+'</td><td>'+E(r.customer_name)+'</td><td>'+E(r.crop)+'</td><td>'+E(r.issue_type)+'</td><td>'+E(r.urgency)+'</td><td>'+E(r.status)+'</td><td>'+E(r.created_at)+'</td><td><button class="s" onclick="openFarmIssue('+r.id+')">Open</button></td></tr>').join('')+'</table></div>';return}
let rows=await api(k=='seller_profiles'?'admin/sellers/payouts':'admin/'+k);if(!rows)return;let cols=rows[0]?Object.keys(rows[0]):[];
let form=CREATE[k]?`<div class="f">${CREATE[k].map(f=>`<input id="c_${f}" placeholder="${f}">`).join('')}<button onclick="create('${k}')">+ Add</button></div>`:'';
if(k=='users')form+=`<div class="f"><input id="a_e" placeholder="staff email"><input id="a_n" placeholder="name"><input id="a_p" type="password" placeholder="password"><select id="a_r">${['verification','operations','finance','support','catalogue','analytics','super'].map(r=>`<option>${r}</option>`)}</select><button onclick="addAdmin()">+ Staff account</button></div>`;
$('main').innerHTML=`<h2>${SECTIONS[k]}</h2>${form}<div class="w"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>actions</th></tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${E(r[c])}</td>`).join('')}<td>${(ACT[k]||[]).map(a=>a[0]=='esc'?`<button class=s onclick="esc(${r.id},'${a[1]}')">${a[1]}</button>`:a[0]=='refund'?`<button class=s onclick="refund(${r.id})">refund</button>`:`<button class=s onclick="patch('${k}',${r.id},'${a[0]}',${JSON.stringify(a[1])})">${a[1]}</button>`).join(' ')}${k=='documents'?`<button class=s onclick="viewDoc(${r.id})">open</button>`:''}</td></tr>`).join('')}</table></div>`}
async function openFarmIssue(id){let x=await api('admin/farm-issues/'+id);if(!x)return;$('main').innerHTML=`<button class="s" onclick="show('farm_issues')">← Back to reports</button><h2>Farm issue #${x.id}</h2><p><b>${E(x.customer_name)}</b> · ${E(x.crop)} · ${E(x.issue_type)} · ${E(x.urgency)} urgency</p><p>${E(x.description)}</p><p>Status: <select id="farmIssueStatus"><option>open</option><option>investigating</option><option>resolved</option><option>cancelled</option></select> <button onclick="saveFarmIssueStatus(${x.id})">Save status</button></p><h3>Customer messages</h3>${x.messages.map(m=>'<div class="k"><b>'+(m.sender_id===x.customer_id?'Customer':'Agronomist / Support')+'</b><p>'+E(m.message)+'</p><small>'+E(m.created_at)+'</small></div>').join('')}<div class="f"><input id="farmIssueReply" placeholder="Reply to customer" style="flex:1"><button onclick="replyFarmIssue(${x.id})">Send reply</button></div><p>Attachments: ${x.attachments.map(a=>E(a.filename)).join(', ')||'None'}</p>`;document.getElementById('farmIssueStatus').value=x.status}
async function replyFarmIssue(id){let message=document.getElementById('farmIssueReply').value.trim();if(!message)return;if(await api('admin/farm-issues/'+id+'/messages','POST',{message}))openFarmIssue(id)}
async function saveFarmIssueStatus(id){let status=document.getElementById('farmIssueStatus').value;if(await api('admin/farm-issues/'+id,'PATCH',{status}))openFarmIssue(id)}
async function patch(k,id,f,v){if(await api(`admin/${k}/${id}`,'PATCH',{[f]:v}))show(k)}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function esc(id,a){if(a=='events'){let r=await api(`admin/escrow/${id}/events`);return r&&alert(r.map(x=>x.created_at+' '+x.event+' '+(x.note||'')).join('\n'))}
let ref='',note='';if(a=='release'||a=='refund'){ref=prompt(a=='release'?'Payout M-Pesa/bank reference (after you paid the provider):':'Refund reference (after you paid the customer):');if(!ref)return}
else if(a=='reject'){note=prompt('Reason:')||''}else if(!confirm('Confirm you SEE this payment in the platform account?'))return;
if(await api(`admin/escrow/${id}/${a}`,'POST',{ref,note}))show('escrow')}
async function refund(id){if(confirm('Refund payment?')&&await api(`admin/payments/${id}/refund`,'POST'))show('payments')}
async function create(k){let b={};CREATE[k].forEach(f=>{let v=document.getElementById('c_'+f).value;if(v!=='')b[f]=isNaN(v)||f=='name'||f=='key'||f=='value'||f=='currency'||f=='description'?v:+v});if(await api('admin/'+k,'POST',b))show(k)}
async function addAdmin(){const email=$('a_e').value.trim(),name=$('a_n').value.trim(),password=$('a_p').value,role=$('a_r').value;if(!email||!password){alert('Enter a staff email and password.');return}if(password.length<8){alert('Use a password with at least 8 characters.');return}if(await api('admin/users','POST',{email,name,password,role}))show('users')}
async function viewDoc(id){let r=await fetch(`/api/admin/documents/${id}/file`,{headers:H()});if(!r.ok)return alert('Cannot open');open(URL.createObjectURL(await r.blob()))}
if(T)start();
setInterval(()=>{if(currentSection==='activity'&&T)show('activity')},10000);
</script></body></html>
